version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  django:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/app/scripts/start-django.sh"]
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/app/scripts/start-fastapi.sh"]
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/app/scripts/start-celery-worker.sh"]
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - django
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    ports:
      - "3000:80"
    depends_on:
      - fastapi

volumes:
  postgres_data:

